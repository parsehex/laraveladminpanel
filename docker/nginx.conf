server {

    listen 10000;

    server_name _;

    root /var/www/public;

    index index.php index.html;

    client_max_body_size 50M;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/wasm font/ttf;

    location / {

        try_files $uri $uri/ /index.php?$query_string;

    }

    # Vite output has content-hashed filenames; public/vendor uses versioned
    # directories (e.g. jquery-3.6.0/). Both are safe to cache forever.
    # add_header here replaces the server-level headers, so repeat them.
    location /build/assets/ {

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
        try_files $uri =404;

    }

    location /vendor/ {

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
        try_files $uri =404;

    }

    location ~ \.php$ {

        include fastcgi_params;

        fastcgi_pass 127.0.0.1:9000;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        fastcgi_param DOCUMENT_ROOT $realpath_root;

    }

    location ~ /\.(?!well-known).* {

        deny all;

    }

}